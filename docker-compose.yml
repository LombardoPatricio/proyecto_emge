services:

  web:
    build: .
    container_name: proyecto_emge_php
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db


  db:
    image: mysql:8
    container_name: proyecto_emge_mysql
    restart: always
    environment:
      MYSQL_DATABASE: phoneshop
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql


volumes:
  mysql_data: